<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <title>Excluir Tarefa</title>
</head>
<body>
    <h1>Excluir Tarefa</h1>
    
    <p>Tens a certeza que desejas apagar a tarefa "<strong>{{ tarefa.titulo }}</strong>"? Esta ação não pode ser desfeita.</p>
    
    <form method="post">
        {% csrf_token %}
        <button type="submit">Sim, quero apagar</button>
    </form>
    
    <br>
    <a href="{% url 'detalhe_tarefa' tarefa.pk %}">Cancelar e Voltar</a>
</body>
</html>
